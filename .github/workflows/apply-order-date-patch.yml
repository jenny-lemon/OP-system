name: Apply order date patch
on:
  push:
    branches: [main]
    paths: ['order-date-patch-trigger.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('opapp.py')
          s = p.read_text()
          old = 'import performance_report as _performance_report\n'
          new = old + 'import order_date_report_ui as _order_date_report_ui\n'
          if 'import order_date_report_ui as _order_date_report_ui' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          old = '''            _performance_report.generate_order_date_report(\n                order_start.strftime("%Y-%m-%d"),\n                order_end.strftime("%Y-%m-%d"),\n                trigger="dashboard",\n            )\n'''
          new = old + '''            _order_date_report_ui.generate_service_report(\n                order_start.strftime("%Y-%m-%d"),\n                order_end.strftime("%Y-%m-%d"),\n                trigger="dashboard",\n            )\n'''
          if '_order_date_report_ui.generate_service_report(' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          old = '''    st.dataframe(\n        _format_report_df(paid_df), use_container_width=True, hide_index=True, height=280,\n        column_config=_report_column_config(paid_df),\n    )\n\n\ndef render_order_date_report_tab():\n'''
          new = '''    st.dataframe(\n        _format_report_df(paid_df), use_container_width=True, hide_index=True, height=280,\n        column_config=_report_column_config(paid_df),\n    )\n\n    _order_date_report_ui.show_combined_table(\n        df, _format_report_df, _report_column_config\n    )\n\n\ndef render_order_date_report_tab():\n'''
          if '_order_date_report_ui.show_combined_table(' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          old = '''    _show_order_date_summary_tables("order_date_summary.csv", "尚未產生付款彙總，請選擇日期後按確定。")\n\n\ndef render_month_performance_report_tab():\n'''
          new = '''    _show_order_date_summary_tables("order_date_summary.csv", "尚未產生付款彙總，請選擇日期後按確定。")\n    _order_date_report_ui.show_service_tables(\n        LATEST_DIR, _read_csv_safe, _format_report_df, _report_column_config\n    )\n\n\ndef render_month_performance_report_tab():\n'''
          if '_order_date_report_ui.show_service_tables(' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f order-date-patch-trigger.txt .github/workflows/apply-order-date-patch.yml
          python -m py_compile opapp.py order_date_report_ui.py order_date_service_report.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Add combined and appliance water-wash payment tables'
          git push
